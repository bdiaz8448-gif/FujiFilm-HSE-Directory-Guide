  <h1>This directory has moved</h1>

     Update your bookmark and any saved home-screen shortcut.</p>
  <a href="https://bdiaz8448-gif.github.io/hse-aura-directory/">Open the HSE Directory</a>

<script>
/* Remove this repo's old service worker + caches so no stale copy of the
   directory can keep being served from this retired address. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
}
if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
setTimeout(function(){ location.replace('https://bdiaz8448-gif.github.io/hse-aura-directory/'); }, 400);
</script>
